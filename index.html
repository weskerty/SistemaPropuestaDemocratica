<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paraguay Libre - Propuestas</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/13.0.1/markdown-it.min.js"></script>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div id="app">
        <h1 class="page-title">Propuestas</h1>
        <div class="grid-gallery" id="proposals-grid">
            <p class="state-msg">Cargando propuestas...</p>
        </div>
    </div>

    <div id="discussion-detail" style="display:none;">
        <button class="back-button" onclick="vL()">&larr; Volver a la lista</button>
        <div id="discussion-content"></div>
        <div id="discussion-comments"></div>
    </div>

    <script>
        const OWNER = 'weskerty';
        const REPO = 'SistemaPropuestaDemocratica';
        const NEW_DISCUSSION_URL = `https://github.com/${OWNER}/${REPO}/discussions/new`;
        const REACTION_EMOJI = {THUMBS_UP:'👍',THUMBS_DOWN:'👎',LAUGH:'😄',HOORAY:'🎉',CONFUSED:'😕',HEART:'❤️',ROCKET:'🚀',EYES:'👀'};

        let INDEX = [];
        let md;

        window.addEventListener('load', () => {
            md = window.markdownit({html:true, breaks:true, linkify:true});
            loadIndex();
        });

        async function loadIndex() {
            const grid = document.getElementById('proposals-grid');
            try {
                const r = await fetch(`Data/index.json?t=${Date.now()}`);
                if (!r.ok) throw new Error(`Error ${r.status}`);
                INDEX = await r.json();
                renderGrid();
            } catch (e) {
                grid.innerHTML = `<p class="state-msg">Error cargando propuestas: ${e.message}</p>`;
            }
        }

        function reactionsBar(reactions) {
            const items = Object.entries(reactions || {}).map(([k,v]) => {
                const emoji = REACTION_EMOJI[k] || k;
                return `<span class="reaction-chip">${emoji} ${v}</span>`;
            }).join('');
            return items ? `<div class="reactions-bar">${items}</div>` : '';
        }

        function renderGrid() {
            const grid = document.getElementById('proposals-grid');
            if (INDEX.length === 0) {
                grid.innerHTML = '<p class="state-msg">No hay propuestas abiertas</p>';
                return;
            }
            grid.innerHTML = INDEX.map(p => `
                <div class="proposal-card" onclick="viewProposal('${p.slug}')">
                    <span class="category-pill">${p.categoryEmoji || ''} ${p.category}</span>
                    <h3>${p.title}</h3>
                    ${reactionsBar(p.reactions)}
                    <div class="proposal-meta">
                        <span>💬 ${p.commentCount}</span>
                        ${p.isAnswered ? '<span class="answered-badge">Respondida</span>' : ''}
                    </div>
                </div>
            `).join('');
        }

        async function viewProposal(slug) {
            document.getElementById('app').style.display = 'none';
            document.getElementById('discussion-detail').style.display = 'block';
            window.scrollTo({top:0, behavior:'smooth'});

            const content = document.getElementById('discussion-content');
            content.innerHTML = '<p class="state-msg">Cargando propuesta...</p>';

            try {
                const r = await fetch(`Data/${slug}.json?t=${Date.now()}`);
                if (!r.ok) throw new Error(`Error ${r.status}`);
                const data = await r.json();
                renderDetail(data);
            } catch (e) {
                content.innerHTML = `<p class="state-msg">Error: ${e.message}</p>`;
            }
        }

        function renderDetail(d) {
            const content = document.getElementById('discussion-content');
            content.innerHTML = `
                <div class="detail-head">
                    <span class="category-pill">${d.categoryEmoji || ''} ${d.category}</span>
                    <h1>${d.title}${d.isAnswered ? ' <span class=\"answered-badge\">✓ Respondida</span>' : ''}</h1>
                    <div class="author-row">
                        ${d.avatar ? `<img src="${d.avatar}" alt="">` : ''}
                        <a href="https://github.com/${d.author}" target="_blank" style="color:inherit;text-decoration:none;">${d.author || 'anonimo'}</a>
                        <span>· #${d.number} · 💬 ${d.commentCount}</span>
                    </div>
                    ${reactionsBar(d.reactions)}
                    <div class="markdown-content">${md.render(d.body || '')}</div>
                </div>
            `;

            const commentsEl = document.getElementById('discussion-comments');
            const topLevel = d.comments || [];

            if (topLevel.length === 0) {
                commentsEl.innerHTML = '<div class="comments-section"><p class="no-comments">Sin comentarios aun</p></div>';
            } else {
                commentsEl.innerHTML = `
                    <div class="comments-section">
                        <h2>Comentarios (${topLevel.length})</h2>
                        ${topLevel.map(c => `
                            <div class="comment-thread">
                                ${renderComment(c)}
                                ${c.replies && c.replies.length ? `
                                    <div class="comment-replies">
                                        ${c.replies.map(r => renderComment(r)).join('')}
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            commentsEl.innerHTML += `
                <div style="text-align:center;">
                    <a class="new-proposal-link" href="${NEW_DISCUSSION_URL}" target="_blank">Crear nueva propuesta</a>
                </div>
            `;
        }

        function renderComment(c) {
            return `
                <div class="comment-item${c.isAnswer ? ' is-answer' : ''}">
                    ${c.isAnswer ? '<span class="answer-tag">✓ Respuesta aceptada</span>' : ''}
                    <div class="author-row">
                        ${c.avatar ? `<img src="${c.avatar}" alt="">` : ''}
                        <a href="https://github.com/${c.author}" target="_blank" style="color:inherit;text-decoration:none;">${c.author || 'anonimo'}</a>
                    </div>
                    <div class="markdown-content">${md.render(c.body || '')}</div>
                    ${reactionsBar(c.reactions)}
                </div>
            `;
        }

        function vL() {
            document.getElementById('discussion-detail').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            window.scrollTo({top:0, behavior:'smooth'});
        }
    </script>
</body>
</html>
