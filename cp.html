<style>

* { box-sizing: border-box; margin: 0; padding: 0; }

html { background: #000; min-height: 100%; }

body{
min-height:100vh;
background:#000;
background-image:
  url('wallpaper.avif');
background-size:cover;
background-position:center;
background-repeat:no-repeat;
background-attachment:fixed;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
color:#f5f5f7;
-webkit-font-smoothing:antialiased
}

@media (max-width:480px){
  body{ background-attachment:scroll }
}

.pc-wrap{
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:16px
}

.pc-hd{text-align:center;padding:12px 0 6px}

.pc-hd h1{
font-size:clamp(1.75rem,1.2rem + 2vw,2.75rem);
font-weight:590;
letter-spacing:-.02em;
margin-bottom:6px
}

.pc-sub{font-size:clamp(1rem,2vw,1.3rem);color:rgba(235,235,245,.6)}

.pc-ml{
width:100%;
max-width:650px;
display:grid;
grid-template-columns:1fr;
gap:14px;
margin:20px auto 0
}

@media (min-width:480px){
.pc-ml{grid-template-columns:1fr 1fr}
}

.pc-mi{
padding:18px 16px;
display:flex;
justify-content:center;
align-items:center;
background:rgba(30,30,32,.4);
backdrop-filter:blur(20px) saturate(160%);
-webkit-backdrop-filter:blur(20px) saturate(160%);
border-radius:24px;
border:1px solid rgba(255,255,255,.12);
box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 2px 8px rgba(0,0,0,.3);
text-decoration:none;
color:#fff;
transition:transform .32s cubic-bezier(.32,.72,0,1), box-shadow .32s cubic-bezier(.32,.72,0,1);
min-height:100px
}

.pc-mi:hover{
transform:translateY(-4px);
box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 8px 30px rgba(0,0,0,.4);
text-decoration:none
}

.pc-mi:active,
.pc-mi:focus{ text-decoration:none }

.pc-mc{
display:flex;
flex-direction:column;
align-items:center;
gap:5px;
text-align:center
}

.pc-mc h3{font-size:clamp(1.1rem,2.5vw,1.6em);font-weight:590;margin:0}

.pc-mc p{
font-size:clamp(.92rem,1.8vw,1.2rem);
color:rgba(255,255,255,.7);
line-height:1.35;
margin:0
}

@media (prefers-reduced-transparency: reduce){
  .pc-mi{ backdrop-filter:none; -webkit-backdrop-filter:none; background:rgba(30,30,32,.94) }
}

@supports not (backdrop-filter: blur(1px)){
  .pc-mi{ background:rgba(30,30,32,.94) }
}

@media (prefers-contrast: more){
  .pc-mi{ backdrop-filter:none; background:Canvas; color:CanvasText; border:1px solid CanvasText }
}

@media (prefers-reduced-motion: reduce){
  .pc-mi{ transition-duration:.001ms }
}

</style>
</head>

<div class="pc-wrap">

      </div>
    </a>
  </div>
</div>
