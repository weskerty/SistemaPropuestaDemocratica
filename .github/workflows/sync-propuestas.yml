name: Sync Propuestas

on:
  discussion:
    types: [created, edited, deleted, closed, reopened, category_changed]
  discussion_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  discussions: read

concurrency:
  group: sync-propuestas
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generar Data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: node .github/scripts/gen-data.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Data
          git diff --cached --quiet && exit 0
          git commit -m "sync: actualizar propuestas"
          git push
